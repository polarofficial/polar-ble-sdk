buildscript {
    ext {
        compose_bom_version = '2024.02.00'
        kotlin_version = '2.4.21'
        hilt_version = '2.57.1'
        polar_sdk_version = '8.5.0'
        gson_version = '2.10.1'
    }

    repositories {
        mavenCentral()
        google()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath platform('io.netty:netty-bom:4.1.139.Final')
        constraints {
            // AGP 8 still brings older host-side parsers and crypto libraries.
            classpath('org.apache.commons:commons-compress:1.28.0')
            classpath('org.bitbucket.b_c:jose4j:0.9.7')
            classpath('org.bouncycastle:bcprov-jdk18on:1.86')
            classpath('org.bouncycastle:bcpkix-jdk18on:1.86')
            classpath('org.bouncycastle:bcutil-jdk18on:1.86')
            classpath('org.jdom:jdom2:2.0.6.1')
        }
        classpath 'com.android.tools.build:gradle:8.13.2'
        // Kotlin 2.4 requires D8/R8 9.1.29 or newer, including on AGP 8.
        classpath 'com.android.tools:r8:9.1.56'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        classpath "com.google.protobuf:protobuf-gradle-plugin:0.9.6"
    }
}

plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version "$kotlin_version" apply false
    id 'org.jetbrains.kotlin.plugin.compose' version "$kotlin_version" apply false
    id 'com.google.dagger.hilt.android' version "$hilt_version" apply false
}

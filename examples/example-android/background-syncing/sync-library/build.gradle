plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.polar.polarbgsync'
    compileSdk 34

    defaultConfig {
        minSdk 33
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        if (localSdk.toBoolean()) {
            missingDimensionStrategy 'library', 'sdk'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    constraints {
        implementation('com.google.protobuf:protobuf-javalite:3.25.8') {
            because 'Patch protobuf parsing denial-of-service issues in the SDK transitive runtime'
        }
        implementation('com.squareup.okhttp3:okhttp:4.12.0') {
            because 'Patch certificate validation in the SDK transitive runtime'
        }
        implementation('commons-io:commons-io:2.14.0') {
            because 'Patch XmlStreamReader denial of service in the SDK transitive runtime'
        }
    }

    def useLocalAar = (project.findProperty('bgsyncUseLocalAar') ?: 'false').toString().toBoolean()
    def localAarPath = (project.findProperty('bgsyncLocalAarPath') ?: "${rootDir}/../../android-communications/SdkBuild/polar-ble-sdk.aar").toString()

    if (useLocalAar) {
        compileOnly files(localAarPath)
    } else if (localSdk.toBoolean()) {
        implementation project(':polar-ble-sdk')
    } else {
        implementation "com.github.polarofficial:polar-ble-sdk:${rootProject.ext.polar_sdk_version}"
    }
    implementation "com.google.code.gson:gson:${rootProject.ext.gson_version}"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.18.0'
}
